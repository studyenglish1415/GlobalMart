version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: globalmart-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: globalmart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - globalmart

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: globalmart-backend
    depends_on:
      - postgres
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: globalmart
      JWT_SECRET: docker-secret-key
      JWT_EXPIRATION: 24h
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
    networks:
      - globalmart
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: globalmart-frontend
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_APP_TITLE: GlobalMart
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    networks:
      - globalmart
    command: npm run dev

volumes:
  postgres_data:

networks:
  globalmart:
    driver: bridge
